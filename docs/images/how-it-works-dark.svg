<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>How mc-mod works</title>
<rect width="1320" height="520" rx="16" fill="#161b22"/>
<rect x=".5" y=".5" width="1319" height="519" rx="15.5" fill="none" stroke="#30363d"/>
<g><rect x="40" y="40" width="300" height="190" rx="14" fill="#1c2129" stroke="#30363d" stroke-width="1.5"/>
    <rect x="64" y="64" width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/><g transform="translate(72 72)" fill="none" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" transform="scale(1)"/></g>
    <text x="64" y="126" font-size="20" font-weight="600" fill="#f0f6fc">Your instance</text>
    <text x="64" y="154" font-size="14.5" fill="#9198a1">Prism, CurseForge app, Modrinth App,</text><text x="64" y="176" font-size="14.5" fill="#9198a1">vanilla launcher, or a server folder</text><text x="64" y="198" font-size="14.5" fill="#9198a1">mods/  ·  plugins/  ·  .mc-mod/</text></g>
<g><rect x="510" y="40" width="300" height="190" rx="14" fill="#1c2129" stroke="#30363d" stroke-width="1.5"/>
    <rect x="534" y="64" width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/><g transform="translate(542 72)" fill="none" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></g>
    <text x="534" y="126" font-size="20" font-weight="600" fill="#f0f6fc">mc-mod</text>
    <text x="534" y="154" font-size="14.5" fill="#9198a1">CLI + local server on 127.0.0.1</text><text x="534" y="176" font-size="14.5" fill="#9198a1">detects version and loader</text><text x="534" y="198" font-size="14.5" fill="#9198a1">identifies jars by hash</text></g>
<g><rect x="980" y="40" width="300" height="190" rx="14" fill="#1c2129" stroke="#30363d" stroke-width="1.5"/>
    <rect x="1004" y="64" width="40" height="40" rx="10" fill="#161b22" stroke="#30363d"/><g transform="translate(1012 72)" fill="none" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/></g>
    <text x="1004" y="126" font-size="20" font-weight="600" fill="#f0f6fc">Web UI</text>
    <text x="1004" y="154" font-size="14.5" fill="#9198a1">opens in your browser</text><text x="1004" y="176" font-size="14.5" fill="#9198a1">or a Chromium app window</text><text x="1004" y="198" font-size="14.5" fill="#9198a1">every request carries a session token</text></g>
<rect x="686" y="64" width="100" height="26" rx="13" fill="none" stroke="#3fb950"/>
<text x="736" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">loopback only</text>
<line x1="346" y1="135" x2="504" y2="135" stroke="#6e7681" stroke-width="2"/><path d="M494.9955289764732 139.3496553411123 L504 135 L494.9955289764732 130.6503446588877" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M355.0044710235268 130.6503446588877 L346 135 L355.0044710235268 139.3496553411123" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="425" y="103" text-anchor="middle" font-size="13.5" fill="#9198a1">reads metadata,</text><text x="425" y="122" text-anchor="middle" font-size="13.5" fill="#9198a1">writes verified jars</text>
<line x1="816" y1="135" x2="974" y2="135" stroke="#6e7681" stroke-width="2"/><path d="M964.9955289764732 139.3496553411123 L974 135 L964.9955289764732 130.6503446588877" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M825.0044710235268 130.6503446588877 L816 135 L825.0044710235268 139.3496553411123" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="895" y="103" text-anchor="middle" font-size="13.5" fill="#9198a1">HTTP API</text><text x="895" y="122" text-anchor="middle" font-size="13.5" fill="#9198a1">+ token</text>
<rect x="360" y="330" width="220" height="120" rx="14" fill="#1c2129" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="392" cy="366" r="8" fill="#1bd96a"/>
    <text x="410" y="372" font-size="18" font-weight="600" fill="#f0f6fc">Modrinth</text>
    <text x="384" y="406" font-size="14" fill="#9198a1">no key needed</text>
    <text x="384" y="427" font-size="14" fill="#9198a1">search, hashes, downloads</text>
<rect x="740" y="330" width="220" height="120" rx="14" fill="#1c2129" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="772" cy="366" r="8" fill="#f16436"/>
    <text x="790" y="372" font-size="18" font-weight="600" fill="#f0f6fc">CurseForge</text>
    <text x="764" y="406" font-size="14" fill="#9198a1">your API key, server-side</text>
    <text x="764" y="427" font-size="14" fill="#9198a1">search, hashes, downloads</text>
<line x1="600" y1="236" x2="470" y2="324" stroke="#6e7681" stroke-width="2"/><path d="M475.0184170585549 315.35040519871563 L470 324 L479.89495843375727 322.5543867757192" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M594.9815829414451 244.64959480128437 L600 236 L590.1050415662427 237.4456132242808" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
<line x1="720" y1="236" x2="850" y2="324" stroke="#6e7681" stroke-width="2"/><path d="M840.1050415662427 322.5543867757192 L850 324 L844.9815829414451 315.35040519871563" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M729.8949584337573 237.4456132242808 L720 236 L725.0184170585549 244.64959480128434" fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
<g transform="translate(648 264)" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
<text x="660" y="314" text-anchor="middle" font-size="13.5" fill="#9198a1">HTTPS</text>
<text x="1280" y="492" text-anchor="end" font-size="13" fill="#9198a1">Downloads land in .mc-mod/tmp/, are checked against the platform's hash, then moved into place.</text>
</svg>
